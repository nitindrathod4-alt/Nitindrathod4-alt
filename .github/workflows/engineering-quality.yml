name: Engineering Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        shell: bash
        run: |
          test -f README.md
          test -f github-banner.png
          test -d assets
          echo 'Repository structure: OK'

      - name: Validate JSON metrics when present
        shell: bash
        run: |
          if find data -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('data').glob('*.json'):
              json.load(open(p))
              print(f'Valid JSON: {p}')
          PY
          else
            echo 'No generated JSON yet — skipping.'
          fi

      - name: Check workflow files
        shell: bash
        run: |
          for f in .github/workflows/*.yml; do
            test -s "$f" || exit 1
            echo "Workflow OK: $f"
          done

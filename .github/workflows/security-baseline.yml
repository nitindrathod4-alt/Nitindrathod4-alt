name: Security Baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect obvious private-key files
        shell: bash
        run: |
          if find . -type f \( -name '*.pem' -o -name '*.key' -o -name 'id_rsa' \) -not -path './.git/*' | grep -q .; then
            echo 'Potential private-key file detected.'
            exit 1
          fi
          echo 'Private-key filename check: OK'

      - name: Check for common secret markers
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.svg' '(AWS_SECRET_ACCESS_KEY|PRIVATE KEY-----|ghp_[A-Za-z0-9_]+)' .; then
            echo 'Potential secret marker detected.'
            exit 1
          fi
          echo 'Secret marker check: OK'

      - name: Check dependency and IaC directories are not committed accidentally
        shell: bash
        run: |
          if find . -type d \( -name '.terraform' -o -name 'node_modules' \) -not -path './.git/*' | grep -q .; then
            echo 'Generated dependency/IaC directory found in repository.'
            exit 1
          fi
          echo 'Generated-directory check: OK'

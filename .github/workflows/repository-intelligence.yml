name: Repository Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p generated
          gh api "repos/$REPO" > generated/repository.json
          gh api "repos/$REPO/commits?per_page=20" > generated/recent-commits.json
          gh api "repos/$REPO/pulls?state=all&per_page=20" > generated/recent-pulls.json
          gh api "repos/$REPO/issues?state=all&per_page=20" > generated/recent-issues.json

      - name: Generate JSON and SVG intelligence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from html import escape
          from datetime import datetime, timezone
          p = Path('generated')
          repo = json.loads((p/'repository.json').read_text())
          commits = json.loads((p/'recent-commits.json').read_text())
          pulls = json.loads((p/'recent-pulls.json').read_text())
          issues = json.loads((p/'recent-issues.json').read_text())
          real_issues = [x for x in issues if 'pull_request' not in x]
          summary = {
              'repository': repo.get('full_name'),
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'stars': repo.get('stargazers_count', 0),
              'forks': repo.get('forks_count', 0),
              'open_issues': repo.get('open_issues_count', 0),
              'recent_commits_sample': len(commits),
              'recent_pulls_sample': len(pulls),
              'recent_issues_sample': len(real_issues),
              'visibility': repo.get('visibility', 'unknown')
          }
          (p/'summary.json').write_text(json.dumps(summary, indent=2))
          Path('generated/README.md').write_text(
              '# Repository Intelligence\n\n'
              'Generated automatically by GitHub Actions from the repository API.\n\n'
              f"- Repository: `{summary['repository']}`\n"
              f"- Visibility: `{summary['visibility']}`\n"
              f"- Stars: `{summary['stars']}`\n"
              f"- Forks: `{summary['forks']}`\n"
              f"- Open issues: `{summary['open_issues']}`\n"
              f"- Recent commit sample: `{summary['recent_commits_sample']}`\n"
              f"- Recent PR sample: `{summary['recent_pulls_sample']}`\n"
              f"- Recent issue sample: `{summary['recent_issues_sample']}`\n"
              f"- Generated: `{summary['generated_at']}`\n"
          )
          title = escape(summary['repository'] or 'Repository Intelligence')
          stamp = escape(summary['generated_at'])
          cards = [
              ('STARS', summary['stars']), ('FORKS', summary['forks']),
              ('OPEN ISSUES', summary['open_issues']), ('COMMITS SAMPLE', summary['recent_commits_sample']),
              ('PR SAMPLE', summary['recent_pulls_sample']), ('ISSUE SAMPLE', summary['recent_issues_sample'])
          ]
          svg = [f'''<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
          <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07101d"/><stop offset="1" stop-color="#101b31"/></linearGradient></defs>
          <rect width="1100" height="430" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1098" height="428" rx="23" fill="none" stroke="#294666"/>
          <text x="48" y="58" fill="#67e8f9" font-family="Arial" font-size="13" letter-spacing="3">REPOSITORY INTELLIGENCE</text>
          <text x="48" y="95" fill="#f3f7ff" font-family="Arial" font-size="28" font-weight="700">{title}</text>
          <text x="48" y="122" fill="#91a4bf" font-family="Arial" font-size="13">GitHub API → Data Processing → JSON / SVG</text>''']
          for i, (label, value) in enumerate(cards):
              x = 48 + (i % 3) * 340
              y = 155 + (i // 3) * 105
              svg.append(f'<rect x="{x}" y="{y}" width="310" height="82" rx="14" fill="#0b1728" stroke="#243e5c"/>')
              svg.append(f'<text x="{x+18}" y="{y+25}" fill="#67e8f9" font-family="Arial" font-size="11" letter-spacing="2">{label}</text>')
              svg.append(f'<text x="{x+18}" y="{y+57}" fill="#ffffff" font-family="Arial" font-size="24" font-weight="700">{value}</text>')
          svg.append(f'<text x="48" y="382" fill="#79f2a8" font-family="Arial" font-size="12">AUTOMATED · {stamp}</text>')
          svg.append('</svg>')
          (p/'repository-intelligence.svg').write_text('\n'.join(svg))
          PY

      - name: Commit generated intelligence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/
          git diff --cached --quiet || git commit -m 'chore: update repository intelligence'
          git push

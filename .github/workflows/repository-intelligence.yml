name: Repository Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect repository metadata and activity
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p generated
          gh api "repos/$REPO" > generated/repository.json
          gh api "repos/$REPO/commits?per_page=100" > generated/recent-commits.json
          gh api "repos/$REPO/pulls?state=all&per_page=100" > generated/recent-pulls.json
          gh api "repos/$REPO/issues?state=all&per_page=100" > generated/recent-issues.json

      - name: Generate analysis, health score and SVG
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from html import escape
          from datetime import datetime, timezone, timedelta
          p = Path('generated')
          repo = json.loads((p/'repository.json').read_text())
          commits = json.loads((p/'recent-commits.json').read_text())
          pulls = json.loads((p/'recent-pulls.json').read_text())
          issues = json.loads((p/'recent-issues.json').read_text())
          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(days=30)
          recent_commits = [c for c in commits if c.get('commit',{}).get('author',{}).get('date') and datetime.fromisoformat(c['commit']['author']['date'].replace('Z','+00:00')) >= cutoff]
          real_issues = [x for x in issues if 'pull_request' not in x]
          open_pulls = [x for x in pulls if x.get('state') == 'open']
          open_issues = [x for x in real_issues if x.get('state') == 'open']
          merged_prs = [x for x in pulls if x.get('merged_at')]
          score = 100
          if repo.get('open_issues_count', 0) > 10: score -= 15
          elif repo.get('open_issues_count', 0) > 5: score -= 8
          if len(open_pulls) > 10: score -= 10
          if not recent_commits: score -= 20
          if not repo.get('has_issues', True): score -= 5
          score = max(0, min(100, score))
          if score >= 85: health = 'HEALTHY'
          elif score >= 70: health = 'WATCH'
          else: health = 'REVIEW'
          summary = {
              'repository': repo.get('full_name'),
              'generated_at': now.isoformat(),
              'health_score': score,
              'health_status': health,
              'stars': repo.get('stargazers_count', 0),
              'forks': repo.get('forks_count', 0),
              'watchers': repo.get('subscribers_count', 0),
              'open_issues': repo.get('open_issues_count', 0),
              'open_prs': len(open_pulls),
              'recent_commits_30d_sample': len(recent_commits),
              'recent_prs_sample': len(pulls),
              'merged_prs_sample': len(merged_prs),
              'recent_issues_sample': len(real_issues),
              'visibility': repo.get('visibility', 'unknown'),
              'default_branch': repo.get('default_branch', 'unknown')
          }
          (p/'summary.json').write_text(json.dumps(summary, indent=2))
          Path('generated/analysis.md').write_text(f'''# Repository Analysis\n\n## Health\n- Score: **{score}/100**\n- Status: **{health}**\n\n## 30-Day Activity Sample\n- Commits: **{len(recent_commits)}**\n- Pull requests sampled: **{len(pulls)}**\n- Merged pull requests sampled: **{len(merged_prs)}**\n- Issues sampled: **{len(real_issues)}**\n\n## Interpretation\nThis report is generated from GitHub API samples. The health score is a portfolio-oriented heuristic, not a production SLO or reliability measurement.\n''')
          title = escape(summary['repository'] or 'Repository Intelligence')
          svg = [f'''<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" rx="24" fill="#07101d"/><rect x="1" y="1" width="1098" height="618" rx="23" fill="none" stroke="#294666"/><text x="48" y="58" fill="#67e8f9" font-family="Arial" font-size="13" letter-spacing="3">REPOSITORY INTELLIGENCE · AUTOMATED</text><text x="48" y="95" fill="#f3f7ff" font-family="Arial" font-size="28" font-weight="700">{title}</text><text x="48" y="122" fill="#91a4bf" font-family="Arial" font-size="13">GitHub API → Analyze → Health Score → JSON → SVG</text><rect x="48" y="150" width="1004" height="110" rx="16" fill="#0b1728" stroke="#243e5c"/><text x="72" y="183" fill="#67e8f9" font-family="Arial" font-size="11" letter-spacing="2">REPOSITORY HEALTH</text><text x="72" y="228" fill="#ffffff" font-family="Arial" font-size="32" font-weight="700">{score}/100</text><text x="230" y="222" fill="#79f2a8" font-family="Arial" font-size="18" font-weight="700">{health}</text><text x="72" y="248" fill="#91a4bf" font-family="Arial" font-size="11">Heuristic portfolio score — not production telemetry</text>''']
          cards = [('STARS',summary['stars']),('FORKS',summary['forks']),('WATCHERS',summary['watchers']),('OPEN ISSUES',summary['open_issues']),('OPEN PRS',summary['open_prs']),('COMMITS 30D',summary['recent_commits_30d_sample']),('MERGED PRS',summary['merged_prs_sample']),('ISSUES SAMPLE',summary['recent_issues_sample'])]
          for i,(label,value) in enumerate(cards):
              x=48+(i%4)*260; y=285+(i//4)*105
              svg += [f'<rect x="{x}" y="{y}" width="235" height="82" rx="14" fill="#0b1728" stroke="#243e5c"/>',f'<text x="{x+16}" y="{y+25}" fill="#67e8f9" font-family="Arial" font-size="10" letter-spacing="1.5">{label}</text>',f'<text x="{x+16}" y="{y+57}" fill="#ffffff" font-family="Arial" font-size="24" font-weight="700">{value}</text>']
          svg += [f'<text x="48" y="510" fill="#79f2a8" font-family="Arial" font-size="12">● AUTOMATED DATA + ANALYSIS PIPELINE</text>',f'<text x="48" y="538" fill="#91a4bf" font-family="Arial" font-size="12">Branch: {escape(summary["default_branch"])} · Visibility: {escape(summary["visibility"])}</text>',f'<text x="48" y="565" fill="#91a4bf" font-family="Arial" font-size="11">Generated: {escape(summary["generated_at"])}</text>','</svg>']
          (p/'repository-intelligence.svg').write_text('\n'.join(svg))
          PY

      - name: Commit generated intelligence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/
          git diff --cached --quiet || git commit -m 'chore: add repository trend analysis'
          git push

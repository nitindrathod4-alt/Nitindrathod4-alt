name: Profile Pulse

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate live profile pulse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          DATE=$(date -u '+%d %b %Y, %H:%M UTC')
          REPOS=$(gh api users/nitindrathod4-alt --jq '.public_repos')
          FOLLOWERS=$(gh api users/nitindrathod4-alt --jq '.followers')
          STARS=$(gh api 'search/repositories?q=user:nitindrathod4-alt' --paginate --jq '.items | map(.stargazers_count) | add // 0')
          cat > assets/profile-pulse.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190">
            <defs>
              <linearGradient id="g" x1="0" x2="1">
                <stop offset="0" stop-color="#0f172a"/><stop offset="0.5" stop-color="#123c5a"/><stop offset="1" stop-color="#0f172a"/>
              </linearGradient>
            </defs>
            <rect width="900" height="190" rx="22" fill="url(#g)"/>
            <text x="450" y="42" text-anchor="middle" fill="#7dd3fc" font-family="Arial" font-size="24" font-weight="700">⚡ LIVE DEVOPS PROFILE PULSE</text>
            <text x="150" y="92" text-anchor="middle" fill="white" font-family="Arial" font-size="18">PUBLIC REPOS</text>
            <text x="150" y="125" text-anchor="middle" fill="#38bdf8" font-family="Arial" font-size="30" font-weight="700">$REPOS</text>
            <text x="450" y="92" text-anchor="middle" fill="white" font-family="Arial" font-size="18">FOLLOWERS</text>
            <text x="450" y="125" text-anchor="middle" fill="#38bdf8" font-family="Arial" font-size="30" font-weight="700">$FOLLOWERS</text>
            <text x="750" y="92" text-anchor="middle" fill="white" font-family="Arial" font-size="18">TOTAL STARS</text>
            <text x="750" y="125" text-anchor="middle" fill="#38bdf8" font-family="Arial" font-size="30" font-weight="700">$STARS</text>
            <text x="450" y="165" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="13">Auto-refreshed: $DATE</text>
          </svg>
          EOF

      - name: Commit live dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-pulse.svg
          git diff --cached --quiet || git commit -m 'chore: refresh profile pulse'
          git push

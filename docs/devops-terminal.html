<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevOps Terminal — Nitin Rathod</title><style>*{box-sizing:border-box}body{margin:0;background:#050914;color:#d9f7ff;font:14px ui-monospace,SFMono-Regular,Consolas,monospace}.wrap{max-width:1000px;margin:auto;padding:30px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.btn{color:#d9f7ff;text-decoration:none;border:1px solid #315173;background:#0b1728;padding:10px 14px;border-radius:9px}.term{border:1px solid #24415e;border-radius:14px;background:#07101d;box-shadow:0 20px 60px #0008;overflow:hidden}.bar{padding:12px 16px;background:#0b1728;border-bottom:1px solid #24415e;color:#91a4bf}.out{min-height:440px;padding:20px;white-space:pre-wrap;line-height:1.65}.line{color:#67e8f9}.prompt{display:flex;padding:0 20px 20px;gap:8px}.prompt span{color:#7df3ae}.prompt input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit}.help{color:#91a4bf;margin-top:14px} </style></head><body><div class="wrap"><div class="top"><h2>⚡ DevOps Terminal</h2><a class="btn" href="./index.html">← Dashboard</a></div><div class="term"><div class="bar">nitin@devops-center:~$</div><div class="out" id="out">Welcome to the interactive DevOps terminal. Type <b>help</b> to see supported commands.\n\n</div><form class="prompt" onsubmit="run(event)"><span>nitin@devops:~$</span><input id="cmd" autocomplete="off" autofocus></form></div><div class="help">Demo terminal — commands simulate engineering output; nothing is executed on your machine or AWS account.</div></div><script>const outputs={help:'Available commands:\n  aws status       Show AWS demo status\n  kubectl get pods Show demo Kubernetes pods\n  kubectl get svc  Show demo services\n  docker ps        Show demo containers\n  terraform plan   Show demo Terraform plan\n  systemctl status Show demo service status\n  clear            Clear terminal', 'aws status':'AWS demo environment\nRegion: ap-south-1\nVPC: healthy\nALB: healthy\nCompute: healthy\nDatabase: private\nStatus: OK','kubectl get pods':'NAME              READY   STATUS    RESTARTS\nfrontend-app      1/1     Running   0\nbackend-api       1/1     Running   0\nredis-cache       1/1     Running   0\nmonitoring        1/1     Running   0','kubectl get svc':'NAME              TYPE           PORT\nfrontend-svc      LoadBalancer   80\nbackend-svc       ClusterIP      8080\nmonitoring-svc    ClusterIP      9090','docker ps':'CONTAINER ID   IMAGE                 STATUS\na91d2c1        devops-frontend:1.4   Up\nb83f4e7        devops-backend:1.4    Up\nc44a9f2        nginx:stable          Up','terraform plan':'Terraform will perform the following actions:\n  + aws_vpc.main\n  + aws_lb.app\n  + aws_eks_cluster.main\n  ~ aws_instance.app\nPlan: 3 to add, 1 to change, 0 to destroy.','systemctl status':'● devops-agent.service - DevOps Agent\n   Loaded: loaded\n   Active: active (running)\n   Status: healthy'};function run(e){e.preventDefault();let i=document.getElementById('cmd'),c=i.value.trim(),o=document.getElementById('out');if(!c)return;if(c==='clear'){o.textContent='';i.value='';return}o.innerHTML+='<span class="line">nitin@devops:~$ '+esc(c)+'</span>\n'+esc(outputs[c]||'Command not found. Type help for supported commands.')+'\n\n';i.value='';o.scrollTop=o.scrollHeight}function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</script></body></html>
